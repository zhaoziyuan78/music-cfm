name: cfm
type: cfm
model: {type: latent_dit, latent_dim: 512, hidden_dim: 768, layers: 10, heads: 12, mlp_ratio: 4, dropout: 0.0, condition_injection: adaln, zero_init_output: true, gradient_checkpointing: false}
