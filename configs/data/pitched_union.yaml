# Optional legacy/ablation group. Default codec experiments are per dataset.
name: pitched_union
datasets: [xmidi, emopia, vgmidi]
multidataset: {enabled: true, balanced_sampling: true, sampling_exponent: 0.5}
segmentation: {num_bars: 8, hop_bars: 4, allowed_time_signatures: ["4/4"], minimum_notes: 16, maximum_notes: 4096, drop_incomplete_final_segment: true}
