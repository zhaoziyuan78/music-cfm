# @package _global_
defaults:
  - override /data: xmidi
  - override /transport: cfm
  - override /independence: none

experiment:
  name: e24_cfm_cfg_roundtrip
  stage: transport
  checkpoint_subdir: transport

transport:
  classifier_free_guidance: true
  condition_dropout: 0.1
  guidance_scale: 1.5
  roundtrip:
    enabled: true
    weight: 0.25
    warmup_steps: 5000
    ramp_steps: 5000
    interval: 4
    inverse_steps: 2
    samples_per_batch: 16
    cosine_weight: 0.1
