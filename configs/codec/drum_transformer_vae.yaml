type: transformer_vae
vocab_size: auto
d_model: 512
encoder_layers: 8
decoder_layers: 8
num_heads: 8
ff_multiplier: 4
dropout: 0.1
latent_tokens: 32
latent_dim: 256
max_sequence_length: 512
posterior: diagonal_gaussian
use_learned_latent_queries: true
deterministic_transport_encoding: posterior_mean
kl: {schedule: linear_warmup, warmup_steps: 2000, beta_max: 0.0001, free_bits_per_dim: 0.05}
training:
  seed: 0
  batch_size: 64
  gradient_accumulation: 1
  gradient_checkpointing: false
  decoder_token_dropout: 0.15
  length_bucketing: true
  drop_overlength: true
  dataloader_workers: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  betas: [0.9, 0.95]
  max_steps: 50000
  max_epochs: 50
  warmup_steps: 1000
  gradient_clip_norm: 1.0
  precision: bf16
  ema: {enabled: true, decay: 0.999}
  checkpoint_interval: 250
  validation_interval: 250
  validation_samples: 256
  validation_generation_samples: 8
  validation_generation_max_length: 512
inference: {batch_size: 64, precision: bf16}
codec_scope: {mode: per_dataset}
