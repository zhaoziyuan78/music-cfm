[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cfmusic"
version = "0.1.0"
description = "Shared-noise conditional transport for unpaired counterfactual MIDI style transfer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CFMusic Contributors" }]
dependencies = [
  "gdown>=5.2",
  "hydra-core>=1.3",
  "filelock>=3.13",
  "matplotlib>=3.8",
  "miditoolkit>=1.0.1",
  "mido>=1.3",
  "muspy>=0.5",
  "numpy>=1.26",
  "omegaconf>=2.3",
  "pandas>=2.2",
  "pyarrow>=15",
  "requests>=2.31",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "tensorboard>=2.16",
  "torch==2.11.0",
  "tqdm>=4.66",
  "tabulate>=0.10.0",
]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pre-commit>=3.7", "pytest>=8", "pytest-cov>=5", "ruff>=0.5", "types-requests>=2.31"]
wandb = ["wandb>=0.17"]
ot = ["POT>=0.9"]
audio = ["pyfluidsynth>=1.3"]
all = ["cfmusic[dev,wandb,ot,audio]"]

[project.scripts]
cfmusic-download = "cfmusic.commands.download:main"
cfmusic-prepare = "cfmusic.commands.prepare:main"
cfmusic-train-codec = "cfmusic.commands.train_codec:main"
cfmusic-train-transport = "cfmusic.commands.train_transport:main"
cfmusic-evaluate = "cfmusic.commands.evaluate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cfmusic"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "cfmusic/configs"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cfmusic"]
warn_unused_ignores = true
ignore_missing_imports = true
disable_error_code = ["no-any-return", "no-untyped-call"]
